# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-node"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-node"
description = "Xmip Node model and capability declarations."

[dependencies]
# A role travels in the runtime's host plan, which is serialised; the derive
# lives with the type rather than on a copy of it in the runtime (ADR-0044).
serde = { version = "1", features = ["derive"] }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# A declaration is TOML; its strings are quoted the one way the estate does.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# The test cluster's names, from its `xmip.toml` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { package = "xmip-core-configure", git = "https://github.com/IlleNilsson/xmip-core-configure", branch = "main", features = ["test-support"] }
